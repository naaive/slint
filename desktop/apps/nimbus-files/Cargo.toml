[package]
name = "nimbus-files"
description = "File manager"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nimbus-files"
path = "src/main.rs"

[dependencies]
nimbus-theme = { workspace = true }
nimbus-config = { workspace = true }
slint = { workspace = true, features = ["backend-winit", "renderer-femtovg", "renderer-software", "software-renderer-systemfonts"] }
# Decodes the embedded SVG icons when rendering with the software renderer, as in `--screenshot`.
i-slint-core = { path = "../../../internal/core", default-features = false, features = ["image-decoders", "svg"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
notify = { workspace = true }
dirs = { workspace = true }
futures-channel = "0.3"
futures-util = { workspace = true }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
mime_guess = "2.0.5"
tree_magic_mini = "3.2"
percent-encoding = "2.3"
walkdir = "2.5"
rustix = { version = "1", features = ["fs", "process", "event"] }
md-5 = "0.10"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
resvg = { version = "0.48", default-features = false }
tempfile = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }
nimbus-theme = { workspace = true }

[dev-dependencies]
i-slint-backend-testing = { workspace = true }
tempfile = { workspace = true }
