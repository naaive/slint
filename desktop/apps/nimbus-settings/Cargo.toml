[package]
name = "nimbus-settings"
description = "System settings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nimbus-settings"
path = "src/main.rs"

[dependencies]
nimbus-theme = { workspace = true, features = ["headless"] }
nimbus-config = { workspace = true }
nimbus-ipc = { workspace = true }
nimbus-services = { workspace = true }
nimbus-xdg = { workspace = true }
slint = { workspace = true, features = ["backend-winit", "renderer-femtovg", "renderer-software", "software-renderer-systemfonts"] }
# Decodes the embedded SVG icons when rendering with the software renderer, as in `--screenshot`.
i-slint-core = { path = "../../../internal/core", default-features = false, features = ["image-decoders", "svg"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = { version = "0.48", default-features = false }
png = "0.18"
md-5 = "0.10"
walkdir = "2.5"
rustix = { version = "1", features = ["event", "fs"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
toml = { workspace = true }
xkbcommon = { version = "0.8", default-features = false }

[build-dependencies]
slint-build = { workspace = true }
nimbus-theme = { workspace = true }

[dev-dependencies]
nimbus-test-support = { workspace = true }
i-slint-backend-testing = { workspace = true }
tempfile = { workspace = true }
