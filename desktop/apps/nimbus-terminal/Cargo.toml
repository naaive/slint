[package]
name = "nimbus-terminal"
description = "Terminal emulator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nimbus-terminal"
path = "src/main.rs"

[dependencies]
nimbus-theme = { workspace = true, features = ["headless"] }
nimbus-config = { workspace = true }
slint = { workspace = true, features = ["backend-winit", "renderer-femtovg", "renderer-software", "software-renderer-systemfonts"] }
# Decodes the embedded SVG icons when rendering with the software renderer, as in `--screenshot`.
i-slint-core = { path = "../../../internal/core", default-features = false, features = ["image-decoders", "svg"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
futures-util = { workspace = true }
alacritty_terminal = { version = "0.26", default-features = false }
swash = "0.2.10"
fontdb = { version = "0.24", features = ["memmap"] }
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
futures-channel = "0.3"
rustix = { version = "1", features = ["termios", "process"] }
unicode-width = "0.2"

[build-dependencies]
slint-build = { workspace = true }
nimbus-theme = { workspace = true }

[dev-dependencies]
i-slint-backend-testing = { workspace = true }
tempfile = { workspace = true }
