[package]
name = "nimbus-shell"
description = "The Nimbus desktop shell UI: panel, dock, launcher, overview, quick settings, notifications, and lock screen"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Builds the `nimbus-shell-preview` binary, which runs the shell in a regular window with mock data.
preview = ["slint/backend-winit", "slint/renderer-femtovg", "dep:tracing-subscriber"]

[dependencies]
nimbus-ipc = { workspace = true }
nimbus-config = { workspace = true }
nimbus-xdg = { workspace = true }
nimbus-services = { workspace = true }
nimbus-theme = { workspace = true }
slint = { workspace = true, features = ["renderer-software", "software-renderer-systemfonts"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Decodes the themed icons that `@image-url` embeds and those loaded at runtime with `slint::Image::load_from_path`,
# which `slint` alone doesn't when only the software renderer is enabled.
i-slint-core = { path = "../../../internal/core", default-features = false, features = ["image-decoders", "svg"] }

[build-dependencies]
slint-build = { workspace = true }
nimbus-theme = { workspace = true }

[dev-dependencies]
i-slint-backend-testing = { workspace = true }
tempfile = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }

[[bin]]
name = "nimbus-shell-preview"
path = "src/bin/preview.rs"
required-features = ["preview"]
