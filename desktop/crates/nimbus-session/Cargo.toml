[package]
name = "nimbus-session"
description = "Session entry point: environment setup, D-Bus activation, compositor supervision, autostart, and nimbusctl"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nimbus-session"
path = "src/main.rs"

[[bin]]
name = "nimbusctl"
path = "src/bin/nimbusctl.rs"

[dependencies]
nimbus-ipc = { workspace = true }
nimbus-config = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
