# SPDX-License-Identifier: MIT
#
# xdg-desktop-portal backends for XDG_CURRENT_DESKTOP=Nimbus; see `man portals.conf`.
# Each interface lists backends in order of preference, and the first installed one is used.
[preferred]
default=gtk
# nimbus-portal publishes the color scheme and accent from the Nimbus configuration.
org.freedesktop.impl.portal.Settings=nimbus
# Screen sharing and screenshots need xdg-desktop-portal-wlr, which speaks the wlr screencopy protocols.
org.freedesktop.impl.portal.ScreenCast=wlr;gtk
org.freedesktop.impl.portal.Screenshot=wlr;gtk
org.freedesktop.impl.portal.Secret=gnome-keyring;kwallet
