# SPDX-License-Identifier: MIT

# Nimbus: a Wayland desktop environment built with Rust and Slint.
# This is its own workspace, like examples/ and demos/, and shares the repository target/ directory.
[workspace]
members = [
  "crates/nimbus-ipc",
  "crates/nimbus-config",
  "crates/nimbus-xdg",
  "crates/nimbus-services",
  "crates/nimbus-theme",
  "crates/nimbus-shell",
  "crates/nimbus-shell-host",
  "crates/nimbus-compositor",
  "crates/nimbus-session",
  "crates/nimbus-portal",
  "crates/nimbus-test-support",
  "apps/nimbus-settings",
  "apps/nimbus-files",
  "apps/nimbus-terminal",
  "apps/nimbus-monitor",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.88"

[workspace.dependencies]
nimbus-ipc = { path = "crates/nimbus-ipc" }
nimbus-config = { path = "crates/nimbus-config" }
nimbus-xdg = { path = "crates/nimbus-xdg" }
nimbus-services = { path = "crates/nimbus-services" }
nimbus-theme = { path = "crates/nimbus-theme" }
nimbus-shell = { path = "crates/nimbus-shell" }
nimbus-test-support = { path = "crates/nimbus-test-support" }

slint = { path = "../api/rs/slint", default-features = false, features = ["std", "compat-1-18"] }
slint-build = { path = "../api/rs/build" }
i-slint-backend-testing = { path = "../internal/backends/testing", default-features = false }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "net", "io-util", "fs"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"
notify = "8"
dirs = "6"
calloop = "0.14"
tempfile = "3"

# Slint's generated code makes full debug info several hundred megabytes per binary.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false

# Every process is supervised or activated on demand and restarts into a safe state; see docs/architecture.md, "Panics".
[profile.release]
panic = "abort"
[profile.dev.package.resvg]
opt-level = 3
[profile.dev.package.usvg]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.rgb]
opt-level = 3
[profile.package-release]
inherits = "release"
lto = "fat"
strip = "symbols"
codegen-units = 1
